
name: Node.js CI/CD

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

jobs:
  # ==========================================
  # JOB 1: TEST
  # ==========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test

      REDIS_URL: redis://127.0.0.1:6379

      MONGODB_TEST_URI: ${{ secrets.MONGODB_TEST_URI }}

      # IMPORTANT:
      # These names must match process.env names
      # used inside your JWT utility.
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Check Environment Variables
        run: |
          node -e "
          const required = [
            'MONGODB_TEST_URI',
            'JWT_SECRET_KEY',
            'JWT_ACCESS_SECRET',
            'JWT_REFRESH_SECRET'
          ];

          const missing = required.filter(key => !process.env[key]);

          if (missing.length) {
            console.error('Missing environment variables:', missing.join(', '));
            process.exit(1);
          }

          console.log('Required environment variables are configured.');
          "

      - name: Run Jest Tests and Coverage
        run: npm run test:coverage -- --runInBand

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # JOB 2: BUILD
  # ==========================================
  build:
    name: Build Project
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build --if-present

      - name: Build Successful
        run: echo "Build completed successfully."

  # ==========================================
  # JOB 3: DEPLOYMENT STATUS
  # ==========================================
  deploy:
    name: Deployment Status
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deployment Status
        run: |
          echo "===================================="
          echo "CI/CD Pipeline Successful"
          echo "Tests Passed"
          echo "Build Successful"
          echo "Ready for Deployment"
          echo "Branch: ${{ github.ref_name }}"
          echo "===================================="


name: Node.js CI/CD

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

jobs:
  # ==========================================
  # JOB 1: TEST
  # ==========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test

      # Redis Configuration
      REDIS_URL: redis://127.0.0.1:6379

      # MongoDB Configuration
      MONGODB_TEST_URI: ${{ secrets.MONGODB_TEST_URI }}

      # JWT Configuration
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

      # Gmail SMTP Configuration
      EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
      EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TEST_TO: ${{ secrets.EMAIL_TEST_TO }}

      # Cloudinary Configuration (if required by tests)
      CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Check Environment Variables
      - name: Check Environment Variables
        run: |
          node -e "
          const required = [
            'MONGODB_TEST_URI',
            'JWT_SECRET_KEY',
            'JWT_ACCESS_SECRET',
            'JWT_REFRESH_SECRET',
            'EMAIL_HOST',
            'EMAIL_PORT',
            'EMAIL_USER',
            'EMAIL_PASS',
            'EMAIL_FROM',
            'EMAIL_TEST_TO'
          ];

          const missing = required.filter(
            key => !process.env[key]
          );

          if (missing.length) {
            console.error(
              'Missing environment variables:',
              missing.join(', ')
            );
            process.exit(1);
          }

          console.log(
            'Required environment variables are configured.'
          );
          "

      # Step 5: Run Jest Tests and Coverage
      - name: Run Jest Tests and Coverage
        run: npm run test:coverage -- --runInBand

      # Step 6: Upload Coverage Report
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # JOB 2: BUILD
  # ==========================================
  build:
    name: Build Project
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Build Application
      - name: Build Application
        run: npm run build --if-present

      # Step 5: Build Successful
      - name: Build Successful
        run: echo "Build completed successfully."

  # ==========================================
  # JOB 3: DEPLOYMENT STATUS
  # ==========================================
  deploy:
    name: Deployment Status
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deployment Status
        run: |
          echo "===================================="
          echo "CI/CD Pipeline Successful"
          echo "Tests Passed"
          echo "Real SMTP Configuration Checked"
          echo "Build Successful"
          echo "Ready for Deployment"
          echo "Branch: ${{ github.ref_name }}"
          echo "===================================="
